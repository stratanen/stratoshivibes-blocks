<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>StratoshiVibes Blockspace</title>
<meta name="description" content="Neon block puzzle. Clear lines to reveal the picture.">
<meta name="theme-color" content="#060a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Bungee";src:url(fonts/bungee-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-greek-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-greek-600-normal.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-greek-800-normal.woff2) format("woff2");font-weight:800;font-display:swap;unicode-range:U+0370-03FF,U+1F00-1FFF}

/* Layout: one-screen portrait arcade. Picture + score on top, 8×8 board, tray of three pieces at thumb height */
:root{
  --bg:#060a1e;
  --panel:#0c1336;
  --cyan:#22e4ff;
  --violet:#a45cff;
  --pink:#ff4fd8;
  --gold:#ffb02e;
  --text:#e8edff;
  --dim:#8c95c6;
  --f:"Commissioner",system-ui,sans-serif;
  --fd:"Bungee","Commissioner",system-ui,sans-serif;
  --gap:4px;
  --cell:min(calc((100vw - 80px)/8), calc((100vh - 150px)/14.9), 52px);
  --mini:calc(var(--cell)*.56);
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
  height:100%;
}
@supports (height:100dvh){
  :root{ --cell:min(calc((100vw - 80px)/8), calc((100dvh - 150px)/14.9), 52px); }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%, #1a0f4a 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 100%, #07254a 0%, transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font:14px/1.4 var(--f);
  overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  overscroll-behavior:none;
}
.app{
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
  padding-block:8px;
}
.top,.tray{width:calc(var(--cell)*8 + var(--gap)*7 + 18px)}
.top{display:flex;gap:14px;align-items:stretch}
.reveal{
  position:relative;
  width:calc(var(--cell)*3.3);height:calc(var(--cell)*3.3);
  flex:none;padding:0;
  border-radius:12px;overflow:hidden;
  border:1px solid color-mix(in srgb, var(--violet) 60%, transparent);
  box-shadow:0 0 18px color-mix(in srgb, var(--violet) 45%, transparent);
  background:var(--panel);
  cursor:zoom-in;
}
.reveal canvas{width:100%;height:100%;display:block}
.pct{
  position:absolute;left:6px;bottom:6px;
  font-size:11px;font-weight:600;letter-spacing:.06em;
  padding:2px 6px;border-radius:6px;
  background:rgba(6,10,30,.8);color:var(--cyan);
  font-variant-numeric:tabular-nums;
}
.stats{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.eyebrow{font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eyebrow b{color:var(--pink)}
.help{
  flex:none;width:28px;height:28px;border-radius:50%;
  border:1px solid color-mix(in srgb, var(--cyan) 50%, transparent);
  background:rgba(34,228,255,.08);color:var(--cyan);
  font:800 14px var(--f);cursor:pointer;
}
.score{
  font:400 calc(var(--cell)*.98)/1 var(--fd);
  font-variant-numeric:tabular-nums;
  color:#fff;
  text-shadow:0 0 14px color-mix(in srgb, var(--cyan) 80%, transparent);
}
.score.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.1)}}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.meta b{color:var(--gold)}
.meta .combo{color:var(--pink);font-weight:800}
.bar{height:6px;border-radius:4px;background:#141c47;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 10px var(--pink);transition:width .5s ease}

.board{
  display:grid;
  grid-template-columns:repeat(8,var(--cell));
  grid-template-rows:repeat(8,var(--cell));
  gap:var(--gap);
  padding:9px;
  border-radius:16px;
  background:linear-gradient(160deg,#0e1640,#080d29);
  border:1px solid color-mix(in srgb, var(--cyan) 35%, transparent);
  box-shadow:0 0 24px color-mix(in srgb, var(--cyan) 22%, transparent), inset 0 0 30px rgba(0,0,0,.5);
}
.cell{
  border-radius:22%;
  background:rgba(70,90,200,.08);
  box-shadow:inset 0 0 0 1px rgba(120,140,255,.12);
}
.blk{
  background:var(--img) center/112% no-repeat, var(--k);
  border-radius:22%;
  box-shadow:0 0 9px color-mix(in srgb, var(--k) 55%, transparent);
}
.cell.ghost{
  background:var(--img) center/112% no-repeat;
  opacity:.45;
  box-shadow:0 0 0 1px color-mix(in srgb, var(--k) 80%, transparent);
}
.cell.hl.blk{filter:brightness(1.35) saturate(1.2);box-shadow:0 0 16px #fff, inset 0 0 0 2px #fff}
.cell.pop{animation:pop .38s ease-out both}
@keyframes pop{
  0%{transform:scale(1);filter:brightness(1.6)}
  60%{transform:scale(1.18);opacity:.8;filter:brightness(2.2)}
  100%{transform:scale(.4);opacity:0}
}

.tray{display:grid;grid-template-columns:repeat(3,1fr);height:calc(var(--mini)*5 + 20px)}
.slot{display:grid;place-items:center;touch-action:none;cursor:grab;border-radius:12px}
.slot.lift .piece{opacity:.18}
.slot.dim .piece{opacity:.35;filter:grayscale(.7)}
.piece{display:grid;gap:3px}
.piece.mini{--sz:var(--mini);grid-auto-rows:var(--mini)}
.piece > div{width:var(--sz);height:var(--sz)}
.piece.float{
  position:fixed;left:0;top:0;z-index:30;pointer-events:none;
  will-change:transform;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
}

.toast{
  position:fixed;left:50%;top:42%;z-index:40;
  transform:translate(-50%,-50%) scale(.8);opacity:0;
  font:400 26px var(--fd);letter-spacing:.02em;white-space:nowrap;
  color:#fff;text-align:center;
  text-shadow:0 0 12px var(--pink),0 0 28px var(--violet);
  pointer-events:none;
}
.toast small{display:block;font:800 14px var(--f);color:var(--cyan);text-shadow:0 0 10px var(--cyan);margin-top:6px}
.toast.show{animation:toast 1.1s ease-out both}
@keyframes toast{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  70%{opacity:1;transform:translate(-50%,-60%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-80%) scale(1)}
}

.ov{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;
  background:rgba(4,6,20,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y:auto;
}
.card{
  width:min(100%, 380px);
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  padding:22px 18px;border-radius:18px;
  background:linear-gradient(170deg,#121a4a,#0a0f2e);
  border:1px solid color-mix(in srgb, var(--violet) 55%, transparent);
  box-shadow:0 0 40px color-mix(in srgb, var(--violet) 35%, transparent);
}
.card h2{margin:0;font:400 22px/1.2 var(--fd);letter-spacing:.01em;text-wrap:balance;text-shadow:0 0 14px var(--pink)}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.5;text-wrap:pretty}
.card p b{color:var(--text)}
.big{font:400 44px/1 var(--fd);color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 16px var(--cyan)}
.card canvas{width:min(78vw, 320px, 46vh);height:min(78vw, 320px, 46vh);border-radius:12px;border:1px solid color-mix(in srgb, var(--cyan) 45%, transparent);box-shadow:0 0 22px color-mix(in srgb, var(--cyan) 30%, transparent)}
#oc{width:min(44vw, 170px);height:min(44vw, 170px)}
.btn{
  font:800 16px var(--f);letter-spacing:.04em;
  color:#06081c;
  padding:12px 26px;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(90deg,var(--cyan),var(--violet) 60%,var(--pink));
  box-shadow:0 0 18px color-mix(in srgb, var(--violet) 60%, transparent);
}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.reveal:focus-visible,.btn:focus-visible,.link:focus-visible,.help:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;text-align:left;font-size:14px;line-height:1.45;color:var(--text)}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.rules li::before{content:"";width:12px;height:12px;margin-top:4px;border-radius:3px;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;font-size:13px}
.links a{color:var(--cyan)}
.fine{font-size:12px!important}

/* home screen */
.home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:16px;text-align:center}
.brand .sv{display:block;font:600 12px var(--f);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}
.brand h1{margin:6px 0 0;font:400 clamp(34px, 11vw, 60px)/1 var(--fd);color:#fff;text-shadow:0 0 18px var(--pink),0 0 40px var(--violet)}
.hpic{position:relative;width:min(70vw, 34vh, 340px);aspect-ratio:1;max-width:100%;padding:0;border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb, var(--violet) 60%, transparent);box-shadow:0 0 30px color-mix(in srgb, var(--violet) 45%, transparent);background:var(--panel);cursor:pointer}
.hpic canvas{width:100%;height:100%;display:block}
.hlabel{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:7px;background:rgba(6,10,30,.82);color:var(--cyan);font-variant-numeric:tabular-nums}
.hbest{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.hbest b{color:var(--gold)}
.hbtns{display:flex;flex-direction:column;gap:10px;width:min(100%, 300px)}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn2{font:600 14px var(--f);color:var(--text);padding:11px 12px;border-radius:12px;border:1px solid color-mix(in srgb, var(--cyan) 40%, transparent);background:rgba(34,228,255,.07);cursor:pointer}
.btn2:focus-visible,.gitem:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.help svg{width:16px;height:16px;display:block;margin:auto}
.hbar{display:flex;gap:8px;flex:none}
.sndbtn .off{display:none}
.muted .sndbtn .on{display:none}
.muted .sndbtn .off{display:block}
.homesnd{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);right:max(16px, env(safe-area-inset-right, 0px));width:36px;height:36px}
.ggrid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;width:100%;max-height:min(58vh, 520px);overflow-y:auto;padding:2px}
.ghead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;padding:0 2px;font:800 13px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.ghead:first-child{margin-top:0}
.ghead b{font-variant-numeric:tabular-nums;color:var(--dim)}
.ghead.full b{color:var(--gold)}
.gitem .lock small{display:block;font:600 10px var(--f);color:var(--dim);margin-top:2px}
.gitem{aspect-ratio:1;border-radius:10px;overflow:hidden;padding:0;border:1px solid color-mix(in srgb, var(--violet) 45%, transparent);background:#0b1235;display:grid;place-items:center;color:var(--dim);font:600 12px var(--f);cursor:pointer}
.gitem:disabled{cursor:default}
.gitem img{width:100%;height:100%;object-fit:cover;display:block}
.gitem .lock{display:flex;flex-direction:column;align-items:center;gap:4px}
.gitem .lock b{font:400 20px var(--fd);color:#3a4380}
#vimg{width:min(86vw, 60vh, 480px);height:auto;aspect-ratio:1;border-radius:14px;border:1px solid color-mix(in srgb, var(--cyan) 45%, transparent)}
/* wallet */
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;border-color:color-mix(in srgb, var(--gold) 45%, transparent);background:rgba(255,176,46,.06)}
.wbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.wbtn small{color:var(--dim);font-weight:600}
.wlist{display:flex;flex-direction:column;gap:8px;width:100%}
.witem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb, var(--cyan) 35%, transparent);background:rgba(34,228,255,.05);color:var(--text);font:800 14px var(--f);cursor:pointer;text-align:left}
.witem img{width:32px;height:32px;border-radius:8px;flex:none}
.witem small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.witem:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.waddr{width:100%;font:600 13px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;word-break:break-all;color:var(--text);user-select:text;-webkit-user-select:text}
.wchars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.wchars figure{margin:0;font-size:10px;color:var(--dim);text-align:center}
.wchars img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid var(--gold);display:block;background:#1a1f3d}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wbtns .btn2{flex:1;min-width:110px}
.gitem{position:relative}
.gitem.holder{border:2px solid var(--gold);box-shadow:0 0 12px color-mix(in srgb, var(--gold) 50%, transparent)}
.gitem .star{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1405;font:900 12px/20px system-ui,sans-serif;text-align:center}
#walletCard h2{font:800 22px/1.2 var(--f);letter-spacing:0}
/* shop */
.badge{display:inline-block;margin-top:8px;font:800 11px var(--f);letter-spacing:.12em;text-transform:uppercase;color:#1a1405;background:var(--gold);padding:3px 10px;border-radius:99px;box-shadow:0 0 14px color-mix(in srgb, var(--gold) 60%, transparent)}
.shopbtn{display:flex;align-items:center;justify-content:center;gap:8px;border-color:color-mix(in srgb, var(--pink) 45%, transparent);background:rgba(255,79,216,.07)}
.shopbtn small{color:var(--dim);font-weight:600}
#shopCard h2{font:800 22px/1.2 var(--f);letter-spacing:0}
.sitem{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb, var(--violet) 40%, transparent);background:rgba(255,255,255,.03);text-align:left}
.sitem .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:900 22px var(--f);color:var(--gold);background:rgba(255,176,46,.12)}
.sitem .bd{flex:1;min-width:0}
.sitem b{display:block;font:800 15px var(--f);color:#fff}
.sitem .ds{margin:4px 0 8px;font-size:12.5px;line-height:1.45;color:var(--dim)}
.sitem .rw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sitem .pr{font:800 16px var(--f);color:var(--gold);font-variant-numeric:tabular-nums}
.sitem .own{font:800 12px var(--f);color:#3fe08a}
.sitem .muted2{font-size:12px;color:var(--dim)}
.sbuy{height:36px;border-radius:99px;border:0;padding:0 16px;font:800 13px var(--f);color:#1a1405;background:var(--gold);cursor:pointer}
.sbuy:focus-visible,.scur button:focus-visible,.stog:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.stog{height:32px;border-radius:99px;padding:0 12px;font:700 12px var(--f);color:var(--text);background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb, var(--gold) 50%, transparent);cursor:pointer}
.scur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.scur button{padding:10px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--text);font:800 13px var(--f);cursor:pointer;font-variant-numeric:tabular-nums}
.scur button small{display:block;font-weight:600;font-size:11px;color:var(--dim);margin-top:3px}
.scur button .disc{color:#3fe08a}
.scur button.on{border-color:var(--gold);background:rgba(255,176,46,.14)}
.scur button:disabled{opacity:.4;cursor:default}
.ssum{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;width:100%;font-size:13px;background:rgba(0,0,0,.3);border-radius:12px;padding:12px;text-align:left}
.ssum span{color:var(--dim)}
.ssum b{color:#fff;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.ssum a{color:var(--gold)}
.sok{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--dim);text-align:left}
.sok input{margin-top:2px;accent-color:var(--gold);flex:none;width:16px;height:16px}
.sspin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sspin 1s linear infinite}
@keyframes sspin{to{transform:rotate(360deg)}}
.serr{color:#ffb4ad!important}
.chancebox{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.chancebtn{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,176,46,.12);color:#fff;font:800 15px var(--f);cursor:pointer}
.chancebtn small{display:block;font-weight:600;font-size:12px;color:var(--gold);margin-top:2px}
.chancebox .fine{margin:0}
body.gold .blk{filter:sepia(.9) saturate(2.6) hue-rotate(-12deg) brightness(1.06) contrast(1.05);box-shadow:0 0 10px rgba(255,190,60,.65)}
body.gold .cell.ghost{filter:sepia(.9) saturate(2.6) hue-rotate(-12deg)}

.rateTitle{font:800 22px/1.2 var(--f)!important;letter-spacing:0!important}
.rateBtn{display:inline-block;text-decoration:none}
.lbbtn{display:flex;align-items:center;justify-content:center;gap:8px;border-color:color-mix(in srgb, var(--gold) 45%, transparent)}
.hrow .shopbtn{min-width:0}
.hrow:has(> .shopbtn[hidden]) .lbbtn{grid-column:1/-1}
#lbCard h2{font:800 22px/1.2 var(--f);letter-spacing:0}
.lbtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;padding:4px;border-radius:12px;background:rgba(0,0,0,.25)}
.lbtabs button{padding:8px;border:0;border-radius:9px;background:none;color:var(--dim);font:800 13px var(--f);cursor:pointer}
.lbtabs button.on{background:rgba(34,228,255,.14);color:#fff}
.lbtabs button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.lblist{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:4px;max-height:min(46vh, 420px);overflow-y:auto}
.lblist li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px;font-variant-numeric:tabular-nums;text-align:left}
.lblist li .r{font:800 13px var(--f);color:var(--dim)}
.lblist li:nth-child(-n+3) .r{color:var(--gold)}
.lblist li .a{font:600 13px ui-monospace,Menlo,monospace;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis}
.lblist li .s{font:800 14px var(--f);color:#fff}
.lblist li.me{background:rgba(255,176,46,.14);box-shadow:inset 0 0 0 1px var(--gold)}
.lbme{width:100%;font-size:13px;color:var(--dim)}
.lbme b{color:var(--gold)}
.lbempty{color:var(--dim);font-size:14px}
.blk.sp-bomb{--k:#ff4040;--img:url(tiles/sp-bomb.webp)}
.blk.sp-lightning{--k:#ffb02e;--img:url(tiles/sp-lightning.webp)}
.slot .blk.sp-bomb,.slot .blk.sp-lightning{animation:sppulse 1.1s ease-in-out infinite}
@keyframes sppulse{50%{transform:scale(1.12);box-shadow:0 0 18px var(--k)}}
.cell.zap{box-shadow:inset 0 0 0 2px #fff,0 0 12px var(--gold)!important;background:rgba(255,176,46,.22)}
@media (prefers-reduced-motion: reduce){.slot .blk.sp-bomb,.slot .blk.sp-lightning{animation:none}}
.dailybtn{display:flex;align-items:center;justify-content:center;gap:10px;padding-block:10px;border-color:color-mix(in srgb, var(--gold) 60%, transparent);background:linear-gradient(90deg,rgba(255,176,46,.14),rgba(255,79,216,.10))}
.dailybtn > span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.dailybtn small{font:600 11.5px var(--f);color:var(--gold)}
.coach{position:fixed;inset:0;z-index:45;pointer-events:none;transition:opacity .2s}
.coach .bubble{position:fixed;left:50%;transform:translateX(-50%);width:min(88vw, 340px);padding:12px 14px;border-radius:14px;background:rgba(10,15,46,.94);border:1px solid var(--gold);box-shadow:0 0 22px rgba(255,176,46,.35);color:#fff;font:600 14px/1.45 var(--f);text-align:center}
.coach .bubble b{color:var(--gold)}
.coach .bubble button{pointer-events:auto;margin-top:10px}
.coach .hand{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid #fff;box-shadow:0 0 16px rgba(255,255,255,.7);will-change:transform}
.coach .skip{pointer-events:auto;position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));background:none;border:0;color:var(--dim);font:600 13px var(--f);text-decoration:underline;cursor:pointer}
.cell.tgt{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(255,176,46,.6);animation:tgt 1s ease-in-out infinite}
@keyframes tgt{50%{background:rgba(255,176,46,.25)}}
.reveal.point{animation:point 1s ease-in-out infinite}
@keyframes point{50%{box-shadow:0 0 0 3px var(--gold),0 0 30px var(--gold)}}
@media (prefers-reduced-motion: reduce){.cell.tgt,.reveal.point{animation:none}}
#done{z-index:60}
#done .card{width:min(100%, 560px);gap:16px}
#done canvas{
  width:min(88vw, 62vh, 520px);height:min(88vw, 62vh, 520px);
  border-radius:16px;
  animation:showcase 1.4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes showcase{
  0%{transform:scale(.55);opacity:0;filter:brightness(2.5) blur(6px)}
  35%{opacity:1;filter:brightness(1.6) blur(0)}
  60%{transform:scale(1.03)}
  100%{transform:scale(1);filter:none;box-shadow:0 0 50px color-mix(in srgb, var(--pink) 45%, transparent)}
}
#done h2{animation:fadeup .6s .9s ease-out both}
#done p,#done .btn{animation:fadeup .6s 1.3s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .score.bump,.cell.pop,.toast.show,#done canvas,#done h2,#done p,#done .btn{animation-duration:.01s;animation-delay:0s}
  .bar i{transition:none}
}
</style>
</head>

  };

  /* ---------- storage ---------- */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  const readJSON = k => { try { return JSON.parse(store.get(k)); } catch (e) { return null; } };

  /* ---------- language ---------- */
  let lang = store.get('svb_lang') || ((navigator.language || 'en').toLowerCase().startsWith('el') ? 'el' : 'en');
  const t = k => TEXT[lang][k];
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    $('langBtn').textContent = t('lang');
  }

  /* ---------- shapes ---------- */
  const N = 8;
  const RT = () => rev.n || 6, RTT = () => RT() * RT();
  const norm = cs => {
    const mr = Math.min(...cs.map(p => p[0])), mc = Math.min(...cs.map(p => p[1]));
    return cs.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  };
  const rot = cs => norm(cs.map(([r, c]) => [c, -r]));
  const key = cs => cs.map(p => p.join(',')).join(';');
  // [cells, base weight, hard?]  Hard pieces become more frequent as the difficulty rises.
  const BASE = [
    [[[0,0]], 2, false],
    [[[0,0],[0,1]], 3, false],
    [[[0,0],[0,1],[0,2]], 3, false],
    [[[0,0],[0,1],[0,2],[0,3]], 2, true],
    [[[0,0],[0,1],[0,2],[0,3],[0,4]], 1.2, true],
    [[[0,0],[0,1],[1,0],[1,1]], 3, false],
    [[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], 1, true],
    [[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], 1.2, true],
    [[[0,0],[1,0],[1,1]], 2.5, false],
    [[[0,0],[1,0],[2,0],[2,1]], 2.5, true],
    [[[0,0],[0,1],[0,2],[1,1]], 2, true],
    [[[0,1],[0,2],[1,0],[1,1]], 1.4, true],
    [[[0,0],[1,0],[2,0],[2,1],[2,2]], 1.2, true]
  ];
  const SHAPES = [];
  for (const [b, w, hard] of BASE) {
    const seen = new Set(), rots = [];
    let cs = norm(b);
    for (let i = 0; i < 4; i++) {
      const k = key(cs);
      if (!seen.has(k)) { seen.add(k); rots.push(cs); }
      cs = rot(cs);
    }
    rots.forEach(r => SHAPES.push({ cells: r, w: w / rots.length, hard }));
  }
  const sizeOf = cells => ({ h: Math.max(...cells.map(p => p[0])) + 1, w: Math.max(...cells.map(p => p[1])) + 1 });
  // Difficulty from 0 (relaxed) to 0.8: rises gently with the score of the current game and with the chapter.
  const CH_DIFF = { degens: 0, halloween: 0.05, legends: 0.2 };
  function difficulty() {
    const pic = rev && picById(rev.id);
    const ch = pic ? (CH_DIFF[pic.ch] || 0) + (pic.n > 6 ? 0.1 : 0) : 0;
    return Math.min(0.8, ch + Math.min(0.55, score / 4000 * 0.55));
  }
  function makePiece(rand = Math.random, d = difficulty()) {
    const wOf = sh => sh.w * (sh.hard ? 1 + d : 1 - 0.35 * d);
    let x = rand() * SHAPES.reduce((a, sh) => a + wOf(sh), 0), s = SHAPES[0];
    for (const sh of SHAPES) { x -= wOf(sh); if (x <= 0) { s = sh; break; } }
    return { cells: s.cells, ...sizeOf(s.cells), k: Math.floor(rand() * KINDS.length) };
  }
  // ---- daily challenge: same start and same piece sequence for everyone on a UTC day ----
  const utcDay = (ms = Date.now()) => new Date(ms).toISOString().slice(0, 10);
  const DAILY_DIFF = 0.35;
  function seedOf(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function dailyPiece(day, n) { return makePiece(rng(seedOf(day + '#' + n)), DAILY_DIFF); }
  function dailyStartBoard(day) {
    const r = rng(seedOf(day + '#board')), b = new Array(N * N).fill(-1);
    for (let k = 0; k < 14; k++) { const i = Math.floor(r() * N * N); b[i] = Math.floor(r() * KINDS.length); }
    for (let y = 0; y < N; y++) if (b.slice(y * N, y * N + N).every(v => v >= 0)) b[y * N] = -1;
    for (let x = 0; x < N; x++) { let full = true; for (let y = 0; y < N; y++) if (b[y * N + x] < 0) full = false; if (full) b[x] = -1; }
    return b;
  }

  (() => {

  /* ---------- state ---------- */
  let board = new Array(N * N).fill(-1);

  let mode = 'main';                     // 'main' (pictures) or 'daily' (daily challenge)

  let best = +(store.get('svb_best') || 0);
  const dailyBest = () => { const d = readJSON('svb_dbest'); return d && d.day === utcDay() ? +d.best || 0 : 0; };
  function saveBest() { if (mode === 'daily') store.set('svb_dbest', JSON.stringify({ day: dday, best })); else store.set('svb_best', String(best)); }
  let streak = readJSON('svb_streak') || { last: '', n: 0 };
  const streakNow = () => { const y = utcDay(Date.now() - 864e5); return streak.last === utcDay() || streak.last === y ? streak.n : 0; };
  const picById = id => PICS.find(p => p.id === id);

  let rev = readJSON('svb_reveal');
  if (rev && !rev.id && rev.level && Array.isArray(rev.order)) {
    // saves from before chapters: pictures 1..level-1 of the old order were completed
    const L = Math.max(1, rev.level | 0);
    done = OLD_ORDER.slice(0, Math.min(L - 1, OLD_ORDER.length));
    rev.id = OLD_ORDER[(L - 1) % OLD_ORDER.length]; rev.n = 6;
    saveDone();
  }
  function nextPicId() {
    const playable = PICS.filter(isActive);
    const ev = playable.find(p => chapterOf(p).until && !done.includes(p.id));
    if (ev) return ev.id;                       // a live event comes first
    const back = playable.find(p => paused[p.id] && !done.includes(p.id));
    if (back) return back.id;                   // then any picture that was paused
    const open = playable.find(p => !done.includes(p.id));
    if (open) return open.id;
    const pool = playable.filter(p => !chapterOf(p).until);
    const i = pool.findIndex(p => rev && p.id === rev.id);
    return pool[(i + 1) % pool.length].id;      // everything completed: play them again in order
  }

  async function checkHolder(force) {
    if (!W.addr || wLoading) return W.status;
    if (!force && W.status === 'ok' && Date.now() - (W.t || 0) < 5 * 60e3) return 'ok';
    wLoading = true; paintWallet();
    try {
      let page = 1, items = [];
      while (page <= 5) {
        const r = await fetch(WCFG.rpc, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 'svb', method: 'searchAssets',
            params: { ownerAddress: W.addr, grouping: ['collection', WCFG.collection], page, limit: 1000 } }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error.message);
        const it = (j.result && j.result.items) || [];
        items = items.concat(it);
        if (it.length < 1000) break;
        page++;
      }
      const owned = {}; let total = 0;
      for (const it of items) {
        const md = (it.content && it.content.metadata) || {};
        const hit = CHAR_MATCH.find(([, re]) => re.test(md.name || '')) ||
          CHAR_MATCH.find(([, re]) => re.test((md.attributes || []).map(x => x.value).join(' ')));
        if (hit) { owned[hit[0]] = (owned[hit[0]] || 0) + 1; total++; }
      }
      W.owned = owned; W.total = total; W.status = 'ok'; W.t = Date.now();
    } catch (e) { console.warn(e); W.status = 'error'; }
    finally { wLoading = false; saveW(); paintWallet(); }

      prices = { SOL: p('SOL'), SKR: p('SKR'), USDC: 1 }; pricesT = Date.now();

  function shopShow(html) {
    sc$().innerHTML = html; $('shop').hidden = false;
    const f = sc$().querySelector('button:not([disabled])'); if (f) f.focus({ preventScroll: true });
  }
  function closeShop() { if (!shopBusy) $('shop').hidden = true; }
  $('shop').addEventListener('click', e => { if (e.target === $('shop')) closeShop(); });

  function openShop() {
    const sup = isSupporter();
    shopShow('<h2>' + t('shop') + '</h2><p>' + t('shopIntro') + '</p>' +
      '<div class="sitem"><span class="ic" aria-hidden="true">★</span><div class="bd"><b>Supporter Pack</b><div class="ds">' + t('supDesc')(SUPPORTER_CHANCES) + '</div>' +
        '<div class="rw"><span class="pr">' + usdTxt(PRODUCTS.supporter.usd) + '</span>' +
        (sup ? '<span class="own">✓ ' + t('owned') + '</span><button class="stog" type="button" id="goldTog">' + t('goldTiles') + ': ' + (SH.gold !== false ? t('on') : t('off')) + '</button>'
             : '<button class="sbuy" type="button" data-buy="supporter">' + t('buy') + '</button>') +
        '</div></div></div>' +
      '<div class="sitem"><span class="ic" aria-hidden="true">↻</span><div class="bd"><b>' + t('chanceName') + '</b><div class="ds">' + t('chanceDesc') + '</div>' +
        '<div class="rw"><span class="pr">' + usdTxt(PRODUCTS.chance.usd) + '</span><span class="muted2">' +
        (SH.credits ? t('youHave')(SH.credits) : t('chanceWhere')) + '</span></div></div></div>' +
      '<p class="fine">' + t('shopNote')(Math.round(SHOP.skrDiscount * 100), shortAddr(SHOP.treasury)) + '</p>' +
      '<div class="wbtns"><button class="btn2" type="button" data-restore>' + t('restore') + '</button><button class="btn2" type="button" data-x>' + t('close') + '</button></div>');
    sc$().querySelector('[data-x]').onclick = closeShop;
    sc$().querySelector('[data-restore]').onclick = () => restore();
    const b = sc$().querySelector('[data-buy]'); if (b) b.onclick = () => checkout('supporter');
    const g = $('goldTog'); if (g) g.onclick = () => { SH.gold = SH.gold === false; saveSH(); applyPerks(); openShop(); };
  }

  function needWallet() {
    if (W.addr) return true;
    $('shop').hidden = true; $('over').hidden = true;
    toast(t('connectFirst'));
    loadBundle(); openPicker();
    return false;
  }

  async function checkout(id) {
    if (!needWallet()) return;
    const name = id === 'supporter' ? 'Supporter Pack' : t('chanceName');
    shopShow('<h2>' + name + '</h2><div class="sspin" role="status" aria-label="' + t('loading') + '"></div><p>' + t('gettingPrices') + '</p>');
    await getPrices();
    let sym = SH.curr && prices[SH.curr] ? SH.curr : prices.SKR ? 'SKR' : prices.SOL ? 'SOL' : 'USDC';
    const draw = () => {
      const q = quote(id, sym);
      shopShow('<h2>' + name + '</h2>' +
        '<div class="scur">' + ['SKR', 'SOL', 'USDC'].map(k => { const qq = quote(id, k);
          return '<button type="button" data-k="' + k + '" class="' + (k === sym ? 'on' : '') + '"' + (qq ? '' : ' disabled') + '>' + k +
            '<small>' + (qq ? qq.amount + ' ' + k : t('noPrice')) + '</small>' + (k === 'SKR' && qq ? '<small class="disc">−' + Math.round(SHOP.skrDiscount * 100) + '%</small>' : '') + '</button>'; }).join('') + '</div>' +
        '<div class="ssum"><span>' + t('youPay') + '</span><b>' + q.amount + ' ' + sym + ' (≈ ' + usdTxt(q.usd) + ')</b><span>' + t('to') + '</span><b>' + shortAddr(SHOP.treasury) +
          '</b><span>' + t('from') + '</span><b>' + shortAddr(W.addr) + '</b><span>' + t('memo') + '</span><b>' + SHOP.prefix + id + '</b></div>' +
        '<label class="sok"><input type="checkbox" id="shOk"><span>' + t('withdrawal') + '</span></label>' +
        '<div class="wbtns"><button class="btn" type="button" id="shPay" disabled>' + t('pay') + ' ' + q.amount + ' ' + sym + '</button><button class="btn2" type="button" id="shBack">' + t('back') + '</button></div>');
      sc$().querySelectorAll('.scur button').forEach(b => b.onclick = () => { sym = b.dataset.k; SH.curr = sym; saveSH(); draw(); });
      const ok = $('shOk'), pay = $('shPay');
      ok.onchange = () => { pay.disabled = !ok.checked; };
      $('shBack').onclick = () => { if (id === 'supporter') openShop(); else { $('shop').hidden = true; $('over').hidden = false; } };
      pay.onclick = () => payNow(id, name, q);
    };
    draw();
  }

  async function payNow(id, name, q) {
    shopBusy = true;
    shopShow('<h2>' + name + '</h2><div class="sspin"></div><p id="shStep" role="status">' + t('checkingBal') + '</p>');
    const step = x => { const e = $('shStep'); if (e) e.textContent = x; };
    const fail = msg => {
      shopBusy = false;
      shopShow('<h2>' + name + '</h2><p class="serr">' + msg + '</p><div class="wbtns"><button class="btn2" type="button" id="shAgain">' + t('tryAgain') + '</button><button class="btn2" type="button" id="shX">' + t('close') + '</button></div>');
      $('shAgain').onclick = () => checkout(id);
      $('shX').onclick = () => { $('shop').hidden = true; if (id === 'chance' && !$('game').hidden) checkOver(); };
    };
    try {
      await waitWallet();
      const L = await loadPay();
      const bal = await L.balance(W.addr, q.sym);
      if (bal < q.amount + (q.sym === 'SOL' ? 0.0002 : 0)) return fail(t('noFunds')(q.sym, +bal.toFixed(4)));
      if (q.sym !== 'SOL' && await L.balance(W.addr, 'SOL') < 0.0001) return fail(t('needSol'));
      step(t('approve'));
      await SVWallet.ensure();
      if (SVWallet.address && SVWallet.address !== W.addr) return fail(t('otherWallet'));
      const { bytes } = await L.build({ payer: W.addr, treasury: SHOP.treasury, sym: q.sym, amount: q.amount, memo: SHOP.prefix + id });
      let sig;
      try { const r = await SVWallet.signAndSend(bytes); sig = r.signature ? L.bs58.encode(r.signature) : await L.send(r.signed); }
      catch (e) { console.warn(e); return fail(t('cancelled')); }
      step(t('confirming'));
      let confirmed = false;
      try { confirmed = await L.confirm(sig); } catch (e) { return fail(t('txFailed')); }
      shopBusy = false;
      const rec = { sig, sym: q.sym, amount: q.amount, t: Date.now(), pending: !confirmed };
      if (id === 'supporter') {
        const first = !isSupporter();
        SH.own.supporter = rec; if (first) SH.credits += SUPPORTER_CHANCES; SH.gold = true;
        saveSH(); applyPerks();
        shopShow('<h2>' + t('thanks') + '</h2><p>' + t('supThanks')(SUPPORTER_CHANCES) + (confirmed ? '' : ' ' + t('pendingNote')) + '</p>' +
          '<div class="ssum"><span>' + t('paid') + '</span><b>' + q.amount + ' ' + q.sym + '</b><span>' + t('receipt') + '</span><b><a href="https://solscan.io/tx/' + sig + '" target="_blank" rel="noopener">' + shortAddr(sig) + '</a></b></div>' +
          '<button class="btn" type="button" id="shX">' + t('done') + '</button>');
        $('shX').onclick = () => { $('shop').hidden = true; };
        sfx.complete();
      } else {
        SH.lastChance = rec; saveSH();
        $('shop').hidden = true;
        applyChance();
      }
    } catch (e) { console.warn(e); fail(t('genericErr')); }
    finally { shopBusy = false; }
  }

  async function restore() {
    if (!needWallet()) return;
    shopShow('<h2>' + t('restore') + '</h2><div class="sspin"></div><p>' + t('readingHistory') + '</p>');
    try {
      const L = await loadPay(); await getPrices();
      const pays = await L.payments(W.addr, SHOP.treasury, SHOP.prefix);
      let found = 0, chances = 0;
      for (const p of pays) {
        const id = p.memo.slice(SHOP.prefix.length), prod = PRODUCTS[id];
        if (id === 'chance') chances++;
        if (!prod || !prod.restorable) continue;
        const worth = p.sym === 'USDC' ? p.amount : (prices[p.sym] ? p.amount * prices[p.sym] : null);
        const floor = p.sym === 'USDC' ? prod.usd * 0.95 * (1 - SHOP.skrDiscount) : prod.usd * 0.4 * (1 - SHOP.skrDiscount);
        if (worth != null && worth < floor) continue;
        if (!SH.own[id]) {
          SH.own[id] = { sig: p.sig, sym: p.sym, amount: p.amount, t: (p.time || 0) * 1000, restored: true };
          if (id === 'supporter') { SH.credits += SUPPORTER_CHANCES; SH.gold = true; }
          found++;
        }
      }
      saveSH(); applyPerks();
      shopShow('<h2>' + t('restore') + '</h2><p>' + (found ? t('restored')(found) : isSupporter() ? t('allRestored') : t('noneFound')) + '</p>' +
        (chances ? '<p class="fine">' + t('chancesSeen')(chances) + '</p>' : '') + '<button class="btn2" type="button" id="shX">' + t('back') + '</button>');
    } catch (e) {
      console.warn(e);
      shopShow('<h2>' + t('restore') + '</h2><p class="serr">' + t('historyErr') + '</p><button class="btn2" type="button" id="shX">' + t('back') + '</button>');
    }
    $('shX').onclick = openShop;
  }

  /* second chance: clears the three fullest rows, once per game */
  function applyChance() {
    const rows = [...Array(N).keys()].map(r => [r, board.slice(r * N, r * N + N).filter(v => v >= 0).length])
      .sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
    const idx = [];
    rows.forEach(r => { for (let c = 0; c < N; c++) { const i = r * N + c; if (board[i] >= 0) { idx.push([i, board[i]]); board[i] = -1; } } });
    chanceUsed = true; combo = 0;
    if (!tray.some(p => p && anyFit(p))) refill();
    $('over').hidden = true;
    if ($('game').hidden) showGame();
    renderBoard();
    idx.forEach(([i, k], n) => { cells[i].className = 'cell blk k' + k + ' pop'; cells[i].style.animationDelay = Math.min(n * 14, 200) + 'ms'; });
    setTimeout(() => { idx.forEach(([i]) => cells[i].style.animationDelay = ''); renderBoard(); }, 640);
    renderTray(); renderStats(); saveGame();
    sfx.clear(3, 1); buzz([20, 40, 30]);
    toast(t('chanceName') + '!', t('chanceToast'));
  }
  function renderChanceBox() {
    const box = $('chanceBox');
    if (!SHOP_ENABLED && !SH.credits) { box.innerHTML = ''; return; }
    if (chanceUsed) { box.innerHTML = '<p class="fine">' + t('chanceUsed') + '</p>'; return; }
    box.innerHTML = '<button class="chancebtn" type="button" id="chanceBtn">' + t('chanceName') +
      '<small>' + (SH.credits ? t('useOne')(SH.credits) : usdTxt(PRODUCTS.chance.usd) + ' · SKR / SOL / USDC') + '</small></button>' +
      '<p class="fine">' + t('chanceDesc') + '</p>';
    $('chanceBtn').onclick = () => {
      if (SH.credits > 0) { SH.credits--; saveSH(); applyChance(); }
      else if (SHOP_ENABLED) { $('over').hidden = true; checkout('chance'); }
    };
  }

  $('shopBtn').addEventListener('click', openShop);
  $('shopBtn').hidden = !SHOP_ENABLED;
  applyPerks();

  $('closeGallery').addEventListener('click', () => { $('gallery').hidden = true; });
  $('closeView').addEventListener('click', () => { $('view').hidden = true; });
  $('closeHelp').addEventListener('click', () => { $('help').hidden = true; });
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'el' ? 'en' : 'el';
    store.set('svb_lang', lang);
    applyLang(); renderStats(); renderHome(); paintWallet();
  });

  // Rating prompt: shown once, inside the Seeker app only, after the player completes a second picture.
  const IN_APP = /; wv\)/.test(navigator.userAgent);
  let rateDue = false;
  document.querySelectorAll('.rateLink').forEach(a => { a.hidden = !IN_APP; });
  $('rateLater').addEventListener('click', () => { $('rate').hidden = true; });
  $('rateGo').addEventListener('click', () => { store.set('svb_rate', 'opened'); setTimeout(() => { $('rate').hidden = true; }, 400); });

  function showDone() {
    if (!$('over').hidden) { $('over').hidden = true; pendingOver = true; }
    const pic = picById(rev.id);
    const wasNew = !done.includes(pic.id);
    if (wasNew) { done.push(pic.id); saveDone(); if (done.length >= 2 && IN_APP && !store.get('svb_rate')) rateDue = true; }
    const list = PICS.filter(p => p.ch === pic.ch), chDone = list.every(p => done.includes(p.id));
    $('doneName').textContent = pic[lang];
    $('doneTxt').textContent = PICS.filter(isActive).every(p => done.includes(p.id)) && wasNew ? t('allDone')
      : chDone && wasNew ? t('chapterDone')(chapterOf(pic)[lang]) : t('doneTxt');
    $('done').hidden = false;
    if (actx) sfx.complete();
    requestAnimationFrame(() => drawReveal($('dc'), true));
  }
  $('next').addEventListener('click', () => {
    rev = newReveal(nextPicId()); saveRev(); fades.clear();
    $('done').hidden = true;
    if (rateDue) { rateDue = false; store.set('svb_rate', 'asked'); $('rate').hidden = false; }
    renderStats(); renderHome(); kick();
    if (pendingOver) { pendingOver = false; checkOver(); }
  });

  /* ---------- first-game coach (once) ---------- */
  let tut = 0, tutRaf = 0;
  const tutDue = () => !store.get('svb_tut') && done.length === 0 && !(+store.get('svb_best')) && score === 0;
  function tutEnd() {
    tut = 0; store.set('svb_tut', 'done'); cancelAnimationFrame(tutRaf);
    $('coach').hidden = true; $('reveal').classList.remove('point');
    document.querySelectorAll('.cell.tgt').forEach(c => c.classList.remove('tgt'));
  }
  function tutStart() {
    board.fill(-1); score = 0; combo = 0;
    for (let c = 0; c < 6; c++) board[7 * N + c] = [0, 3, 8, 10, 2, 11][c];
    [[6, 0, 9], [6, 1, 12], [6, 3, 6], [5, 0, 13]].forEach(([r, c, k]) => board[r * N + c] = k);
    tray = [{ cells: [[0, 0], [0, 1]], h: 1, w: 2, k: 0 }, { cells: [[0, 0], [1, 0], [1, 1]], h: 2, w: 2, k: 5 }, { cells: [[0, 0], [0, 1], [1, 0], [1, 1]], h: 2, w: 2, k: 3 }];
    renderBoard(); renderTray(); renderStats(); saveGame();
    tut = 1;
    $('coachTxt').innerHTML = t('tut1');
    $('coach').hidden = false; $('coach').style.opacity = 1;
    const bb = $('board').getBoundingClientRect(); $('coachTxt').style.top = (bb.top + 12) + 'px';
    const anim = () => {
      if (tut !== 1) return;
      [7 * N + 6, 7 * N + 7].forEach(i => cells[i].classList.add('tgt'));
      const s = slots[0].getBoundingClientRect(), c0 = cells[7 * N + 6].getBoundingClientRect(), c1 = cells[7 * N + 7].getBoundingClientRect();
      const g = geom(), off = Math.max(40, g.cell * 1.1);
      const sx = s.left + s.width / 2, sy = s.top + s.height / 2, tx = (c0.left + c1.right) / 2, ty = c0.top + g.cell + off;
      const ph = (performance.now() % 2200) / 2200, e = ph < 0.15 ? 0 : ph > 0.85 ? 1 : (ph - 0.15) / 0.7, k = e < .5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
      $('coachHand').style.transform = 'translate(' + (sx + (tx - sx) * k) + 'px,' + (sy + (ty - sy) * k) + 'px)';
      $('coachHand').style.opacity = ph > 0.92 ? 0 : 1;
      tutRaf = requestAnimationFrame(anim);
    };
    anim();
  }
  function tutStep2() {
    if (tut !== 1) return;
    tut = 2; cancelAnimationFrame(tutRaf);
    document.querySelectorAll('.cell.tgt').forEach(c => c.classList.remove('tgt'));
    $('coachHand').style.opacity = 0; $('coach').style.opacity = 1;
    const rb = $('reveal').getBoundingClientRect();
    $('coachTxt').style.top = (rb.bottom + 14) + 'px';
    $('coachTxt').innerHTML = t('tut2') + '<br><button class="btn" type="button" id="tutOk">' + t('tutOk') + '</button>';
    $('reveal').classList.add('point');
    $('tutOk').onclick = tutEnd;
  }
  $('coachSkip').addEventListener('click', tutEnd);
  // hide the coach while dragging so it never covers the board
  document.addEventListener('pointerdown', e => { if (tut === 1 && e.target.closest && e.target.closest('.slot')) $('coach').style.opacity = 0; }, true);
  document.addEventListener('pointerup', () => { if (tut === 1) $('coach').style.opacity = 1; }, true);

  /* ---------- start ---------- */
  applyLang();
  if (!loadGame()) refill();
  renderBoard(); renderTray(); renderStats(); renderHome();
  kick();
  if (rev.count >= RTT()) showDone();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
