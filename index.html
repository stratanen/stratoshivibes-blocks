<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>StratoshiVibes Blocks</title>
<meta name="description" content="Neon block puzzle. Clear lines to reveal the picture.">
<meta name="theme-color" content="#060a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Bungee";src:url(fonts/bungee-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-greek-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-greek-600-normal.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:"Commissioner";src:url(fonts/commissioner-greek-800-normal.woff2) format("woff2");font-weight:800;font-display:swap;unicode-range:U+0370-03FF,U+1F00-1FFF}

/* Layout: one-screen portrait arcade. Picture + score on top, 8×8 board, tray of three pieces at thumb height */
:root{
  --bg:#060a1e;
  --panel:#0c1336;
  --cyan:#22e4ff;
  --violet:#a45cff;
  --pink:#ff4fd8;
  --gold:#ffb02e;
  --text:#e8edff;
  --dim:#8c95c6;
  --f:"Commissioner",system-ui,sans-serif;
  --fd:"Bungee","Commissioner",system-ui,sans-serif;
  --gap:4px;
  --cell:min(calc((100vw - 80px)/8), calc((100vh - 150px)/14.9), 52px);
  --mini:calc(var(--cell)*.56);
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
  height:100%;
}
@supports (height:100dvh){
  :root{ --cell:min(calc((100vw - 80px)/8), calc((100dvh - 150px)/14.9), 52px); }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%, #1a0f4a 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 100%, #07254a 0%, transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font:14px/1.4 var(--f);
  overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  overscroll-behavior:none;
}
.app{
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
  padding-block:8px;
}
.top,.tray{width:calc(var(--cell)*8 + var(--gap)*7 + 18px)}
.top{display:flex;gap:14px;align-items:stretch}
.reveal{
  position:relative;
  width:calc(var(--cell)*3.3);height:calc(var(--cell)*3.3);
  flex:none;padding:0;
  border-radius:12px;overflow:hidden;
  border:1px solid color-mix(in srgb, var(--violet) 60%, transparent);
  box-shadow:0 0 18px color-mix(in srgb, var(--violet) 45%, transparent);
  background:var(--panel);
  cursor:zoom-in;
}
.reveal canvas{width:100%;height:100%;display:block}
.pct{
  position:absolute;left:6px;bottom:6px;
  font-size:11px;font-weight:600;letter-spacing:.06em;
  padding:2px 6px;border-radius:6px;
  background:rgba(6,10,30,.8);color:var(--cyan);
  font-variant-numeric:tabular-nums;
}
.stats{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eyebrow b{color:var(--pink)}
.help{
  flex:none;width:28px;height:28px;border-radius:50%;
  border:1px solid color-mix(in srgb, var(--cyan) 50%, transparent);
  background:rgba(34,228,255,.08);color:var(--cyan);
  font:800 14px var(--f);cursor:pointer;
}
.score{
  font:400 calc(var(--cell)*.98)/1 var(--fd);
  font-variant-numeric:tabular-nums;
  color:#fff;
  text-shadow:0 0 14px color-mix(in srgb, var(--cyan) 80%, transparent);
}
.score.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.1)}}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.meta b{color:var(--gold)}
.meta .combo{color:var(--pink);font-weight:800}
.bar{height:6px;border-radius:4px;background:#141c47;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 10px var(--pink);transition:width .5s ease}

.board{
  display:grid;
  grid-template-columns:repeat(8,var(--cell));
  grid-template-rows:repeat(8,var(--cell));
  gap:var(--gap);
  padding:9px;
  border-radius:16px;
  background:linear-gradient(160deg,#0e1640,#080d29);
  border:1px solid color-mix(in srgb, var(--cyan) 35%, transparent);
  box-shadow:0 0 24px color-mix(in srgb, var(--cyan) 22%, transparent), inset 0 0 30px rgba(0,0,0,.5);
}
.cell{
  border-radius:22%;
  background:rgba(70,90,200,.08);
  box-shadow:inset 0 0 0 1px rgba(120,140,255,.12);
}
.blk{
  background:var(--img) center/112% no-repeat, var(--k);
  border-radius:22%;
  box-shadow:0 0 9px color-mix(in srgb, var(--k) 55%, transparent);
}
.cell.ghost{
  background:var(--img) center/112% no-repeat;
  opacity:.45;
  box-shadow:0 0 0 1px color-mix(in srgb, var(--k) 80%, transparent);
}
.cell.hl.blk{filter:brightness(1.35) saturate(1.2);box-shadow:0 0 16px #fff, inset 0 0 0 2px #fff}
.cell.pop{animation:pop .38s ease-out both}
@keyframes pop{
  0%{transform:scale(1);filter:brightness(1.6)}
  60%{transform:scale(1.18);opacity:.8;filter:brightness(2.2)}
  100%{transform:scale(.4);opacity:0}
}

.tray{display:grid;grid-template-columns:repeat(3,1fr);height:calc(var(--mini)*5 + 20px)}
.slot{display:grid;place-items:center;touch-action:none;cursor:grab;border-radius:12px}
.slot.lift .piece{opacity:.18}
.slot.dim .piece{opacity:.35;filter:grayscale(.7)}
.piece{display:grid;gap:3px}
.piece.mini{--sz:var(--mini);grid-auto-rows:var(--mini)}
.piece > div{width:var(--sz);height:var(--sz)}
.piece.float{
  position:fixed;left:0;top:0;z-index:30;pointer-events:none;
  will-change:transform;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
}

.toast{
  position:fixed;left:50%;top:42%;z-index:40;
  transform:translate(-50%,-50%) scale(.8);opacity:0;
  font:400 26px var(--fd);letter-spacing:.02em;white-space:nowrap;
  color:#fff;text-align:center;
  text-shadow:0 0 12px var(--pink),0 0 28px var(--violet);
  pointer-events:none;
}
.toast small{display:block;font:800 14px var(--f);color:var(--cyan);text-shadow:0 0 10px var(--cyan);margin-top:6px}
.toast.show{animation:toast 1.1s ease-out both}
@keyframes toast{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  70%{opacity:1;transform:translate(-50%,-60%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-80%) scale(1)}
}

.ov{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;
  background:rgba(4,6,20,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y:auto;
}
.card{
  width:min(100%, 380px);
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  padding:22px 18px;border-radius:18px;
  background:linear-gradient(170deg,#121a4a,#0a0f2e);
  border:1px solid color-mix(in srgb, var(--violet) 55%, transparent);
  box-shadow:0 0 40px color-mix(in srgb, var(--violet) 35%, transparent);
}
.card h2{margin:0;font:400 22px/1.2 var(--fd);letter-spacing:.01em;text-wrap:balance;text-shadow:0 0 14px var(--pink)}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.5;text-wrap:pretty}
.card p b{color:var(--text)}
.big{font:400 44px/1 var(--fd);color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 16px var(--cyan)}
.card canvas{width:min(78vw, 320px, 46vh);height:min(78vw, 320px, 46vh);border-radius:12px;border:1px solid color-mix(in srgb, var(--cyan) 45%, transparent);box-shadow:0 0 22px color-mix(in srgb, var(--cyan) 30%, transparent)}
#oc{width:min(44vw, 170px);height:min(44vw, 170px)}
.btn{
  font:800 16px var(--f);letter-spacing:.04em;
  color:#06081c;
  padding:12px 26px;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(90deg,var(--cyan),var(--violet) 60%,var(--pink));
  box-shadow:0 0 18px color-mix(in srgb, var(--violet) 60%, transparent);
}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.reveal:focus-visible,.btn:focus-visible,.link:focus-visible,.help:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;text-align:left;font-size:14px;line-height:1.45;color:var(--text)}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.rules li::before{content:"";width:12px;height:12px;margin-top:4px;border-radius:3px;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;font-size:13px}
.links a{color:var(--cyan)}
.fine{font-size:12px!important}

#done{z-index:60}
#done .card{width:min(100%, 560px);gap:16px}
#done canvas{
  width:min(88vw, 62vh, 520px);height:min(88vw, 62vh, 520px);
  border-radius:16px;
  animation:showcase 1.4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes showcase{
  0%{transform:scale(.55);opacity:0;filter:brightness(2.5) blur(6px)}
  35%{opacity:1;filter:brightness(1.6) blur(0)}
  60%{transform:scale(1.03)}
  100%{transform:scale(1);filter:none;box-shadow:0 0 50px color-mix(in srgb, var(--pink) 45%, transparent)}
}
#done h2{animation:fadeup .6s .9s ease-out both}
#done p,#done .btn{animation:fadeup .6s 1.3s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .score.bump,.cell.pop,.toast.show,#done canvas,#done h2,#done p,#done .btn{animation-duration:.01s;animation-delay:0s}
  .bar i{transition:none}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <button class="reveal" id="reveal" type="button" data-i18n-aria="peekAria">
      <canvas id="rc"></canvas>
      <span class="pct" id="pct">0/36</span>
    </button>
    <div class="stats">
      <div class="head">
        <div class="eyebrow" id="eyebrow"></div>
        <button class="help" id="helpBtn" type="button" data-i18n-aria="helpAria">?</button>
      </div>
      <div class="score" id="score">0</div>
      <div class="meta"><span><span data-i18n="best"></span> <b id="best">0</b></span><span class="combo" id="combo"></span></div>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    </div>
  </header>

  <section class="board" id="board" data-i18n-aria="boardAria"></section>

  <section class="tray" id="tray" data-i18n-aria="trayAria">
    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
  </section>
</main>

<div class="toast" id="toast" aria-live="polite"></div>

<div class="ov" id="over" hidden>
  <div class="card">
    <h2 data-i18n="overTitle"></h2>
    <canvas id="oc"></canvas>
    <div class="big" id="finalScore">0</div>
    <p id="overTxt"></p>
    <button class="btn" id="again" type="button" data-i18n="newGame"></button>
  </div>
</div>

<div class="ov" id="done" hidden>
  <div class="card">
    <h2 data-i18n="doneTitle"></h2>
    <canvas id="dc"></canvas>
    <p data-i18n="doneTxt"></p>
    <button class="btn" id="next" type="button" data-i18n="nextPic"></button>
  </div>
</div>

<div class="ov" id="peek" hidden>
  <div class="card">
    <canvas id="pc"></canvas>
    <p id="peekTxt"></p>
    <button class="btn" id="closePeek" type="button" data-i18n="back"></button>
  </div>
</div>

<div class="ov" id="help" hidden>
  <div class="card">
    <h2 data-i18n="howTitle"></h2>
    <ul class="rules">
      <li data-i18n="r1"></li>
      <li data-i18n="r2"></li>
      <li data-i18n="r3"></li>
      <li data-i18n="r4"></li>
    </ul>
    <p class="fine" data-i18n="free"></p>
    <div class="links">
      <button class="link" id="langBtn" type="button"></button>
      <a href="privacy.html" data-i18n="privacy"></a>
      <a href="terms.html" data-i18n="terms"></a>
    </div>
    <button class="btn" id="closeHelp" type="button" data-i18n="back"></button>
  </div>
</div>

<script>
(() => {
  /* ---------- content you can edit ---------- */
  // Reveal pictures, in order. Add a file to art/ and a line here; after the last one the list starts again.
  const LEVELS = [
    'art/level-01.webp',
    'art/level-02.webp',
    'art/level-03.webp',
    'art/level-04.webp',
    'art/level-05.webp'
  ];
  // Tile artwork (tiles/<name>.webp) and the glow colour of each tile.
  const KINDS = [
    ['btc', '#ffa62b'], ['eth', '#8f7bff'], ['sol', '#2bd98a'], ['diamond', '#3aa8ff'],
    ['degen', '#3aa8ff'], ['rocket', '#6b6bff'], ['chart', '#2bd9b0'], ['wallet', '#a06bff'],
    ['king', '#ffb02e'], ['planet', '#a45cff'], ['star', '#ff4fd8'], ['bolt', '#4d7bff'],
    ['crystal', '#22e4ff'], ['fire', '#ff4040']
  ];

  const TEXT = {
    el: {
      picture: 'Εικόνα', best: 'Ρεκόρ', line: 'Γραμμή!', lines: n => n + ' γραμμές!',
      pieces: n => '+' + n + ' κομμάτια εικόνας',
      overTitle: 'Δεν χωράει άλλο κομμάτι',
      overTxt: (b, p) => 'Ρεκόρ <b>' + b + '</b><br>Η εικόνα κρατάει την πρόοδό της: <b>' + p + '</b> κομμάτια.',
      newGame: 'Νέα παρτίδα',
      doneTitle: 'Η εικόνα αποκαλύφθηκε!',
      doneTxt: 'Όλα τα 36 κομμάτια ξεκλειδώθηκαν. Η εικόνα μένει εδώ μέχρι να πατήσεις.',
      nextPic: 'Επόμενη εικόνα',
      peekTxt: c => c + ' από 36 κομμάτια ξεκλειδωμένα. Κάθε γραμμή που καθαρίζεις αποκαλύπτει περισσότερα.',
      back: 'Συνέχεια',
      howTitle: 'Πώς παίζεται',
      r1: 'Σύρε τα κομμάτια στο ταμπλό.',
      r2: 'Γέμισε μια γραμμή ή μια στήλη για να καθαρίσει.',
      r3: 'Κάθε καθαρισμός αποκαλύπτει κομμάτια της εικόνας. Τα combos αποκαλύπτουν περισσότερα.',
      r4: 'Η παρτίδα τελειώνει όταν δεν χωράει κανένα κομμάτι. Η εικόνα κρατάει την πρόοδό της.',
      free: 'Δωρεάν, χωρίς διαφημίσεις και χωρίς σύνδεση wallet.',
      privacy: 'Απόρρητο', terms: 'Όροι χρήσης', lang: 'English',
      peekAria: 'Δες την εικόνα σε μεγάλο μέγεθος', helpAria: 'Πώς παίζεται',
      boardAria: 'Ταμπλό 8 επί 8', trayAria: 'Κομμάτια'
    },
    en: {
      picture: 'Picture', best: 'Best', line: 'Line!', lines: n => n + ' lines!',
      pieces: n => '+' + n + ' picture pieces',
      overTitle: 'No room left',
      overTxt: (b, p) => 'Best <b>' + b + '</b><br>Your picture keeps its progress: <b>' + p + '</b> pieces.',
      newGame: 'New game',
      doneTitle: 'Picture unlocked!',
      doneTxt: 'All 36 pieces are unlocked. The picture stays here until you tap.',
      nextPic: 'Next picture',
      peekTxt: c => c + ' of 36 pieces unlocked. Every line you clear reveals more.',
      back: 'Back to game',
      howTitle: 'How to play',
      r1: 'Drag the pieces onto the board.',
      r2: 'Fill a row or a column to clear it.',
      r3: 'Every clear reveals pieces of the picture. Combos reveal more.',
      r4: 'The game ends when no piece fits. Your picture keeps its progress.',
      free: 'Free, no ads, no wallet connection.',
      privacy: 'Privacy', terms: 'Terms', lang: 'Ελληνικά',
      peekAria: 'View the picture full size', helpAria: 'How to play',
      boardAria: '8 by 8 board', trayAria: 'Pieces'
    }
  };

  /* ---------- storage ---------- */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const readJSON = k => { try { return JSON.parse(store.get(k)); } catch (e) { return null; } };

  /* ---------- language ---------- */
  let lang = store.get('svb_lang') || ((navigator.language || 'en').toLowerCase().startsWith('el') ? 'el' : 'en');
  const t = k => TEXT[lang][k];
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    $('langBtn').textContent = t('lang');
  }

  /* ---------- shapes ---------- */
  const N = 8, T = 6, TT = T * T;
  const norm = cs => {
    const mr = Math.min(...cs.map(p => p[0])), mc = Math.min(...cs.map(p => p[1]));
    return cs.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  };
  const rot = cs => norm(cs.map(([r, c]) => [c, -r]));
  const key = cs => cs.map(p => p.join(',')).join(';');
  const BASE = [
    [[[0,0]], 2],
    [[[0,0],[0,1]], 3],
    [[[0,0],[0,1],[0,2]], 3],
    [[[0,0],[0,1],[0,2],[0,3]], 2],
    [[[0,0],[0,1],[0,2],[0,3],[0,4]], 1.2],
    [[[0,0],[0,1],[1,0],[1,1]], 3],
    [[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], 1],
    [[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], 1.2],
    [[[0,0],[1,0],[1,1]], 2.5],
    [[[0,0],[1,0],[2,0],[2,1]], 2.5],
    [[[0,0],[0,1],[0,2],[1,1]], 2],
    [[[0,1],[0,2],[1,0],[1,1]], 1.4],
    [[[0,0],[1,0],[2,0],[2,1],[2,2]], 1.2]
  ];
  const SHAPES = [];
  for (const [b, w] of BASE) {
    const seen = new Set(), rots = [];
    let cs = norm(b);
    for (let i = 0; i < 4; i++) {
      const k = key(cs);
      if (!seen.has(k)) { seen.add(k); rots.push(cs); }
      cs = rot(cs);
    }
    rots.forEach(r => SHAPES.push({ cells: r, w: w / rots.length }));
  }
  const TOTALW = SHAPES.reduce((a, s) => a + s.w, 0);
  const sizeOf = cells => ({ h: Math.max(...cells.map(p => p[0])) + 1, w: Math.max(...cells.map(p => p[1])) + 1 });
  function makePiece() {
    let x = Math.random() * TOTALW, s = SHAPES[0];
    for (const sh of SHAPES) { x -= sh.w; if (x <= 0) { s = sh; break; } }
    return { cells: s.cells, ...sizeOf(s.cells), k: Math.floor(Math.random() * KINDS.length) };
  }

  /* ---------- tile styles ---------- */
  (() => {
    const st = document.createElement('style');
    st.textContent = KINDS.map(([n, c], i) => `.k${i}{--k:${c};--img:url(tiles/${n}.webp)}`).join('');
    document.head.appendChild(st);
  })();

  /* ---------- state ---------- */
  let board = new Array(N * N).fill(-1);
  let tray = [null, null, null];
  let score = 0, combo = 0;
  let best = +(store.get('svb_best') || 0);
  let rev = readJSON('svb_reveal');
  if (!rev || !Array.isArray(rev.order) || rev.order.length !== TT) rev = newReveal(1);
  function newReveal(level) {
    const order = [...Array(TT).keys()];
    for (let i = TT - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return { level, count: 0, order };
  }
  const saveRev = () => store.set('svb_reveal', JSON.stringify(rev));
  const saveGame = () => store.set('svb_game', JSON.stringify({
    board, score, combo, tray: tray.map(p => p ? { cells: p.cells, k: p.k } : null)
  }));
  function loadGame() {
    const g = readJSON('svb_game');
    if (!g || !Array.isArray(g.board) || g.board.length !== N * N || !Array.isArray(g.tray)) return false;
    board = g.board.map(v => (Number.isInteger(v) && v >= 0 && v < KINDS.length) ? v : -1);
    score = +g.score || 0; combo = +g.combo || 0;
    tray = g.tray.slice(0, 3).map(p => (p && Array.isArray(p.cells) && p.cells.length) ? { cells: p.cells, ...sizeOf(p.cells), k: p.k % KINDS.length } : null);
    while (tray.length < 3) tray.push(null);
    if (tray.every(p => !p)) refill();
    return true;
  }

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), slots = [...document.querySelectorAll('.slot')];
  const cells = [];
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cells.push(d);
  }

  const canPlace = (p, r, c) => p.cells.every(([dr, dc]) => {
    const rr = r + dr, cc = c + dc;
    return rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr * N + cc] < 0;
  });
  function anyFit(p) {
    for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(p, r, c)) return true;
    return false;
  }
  function fullLines(b) {
    const set = new Set(); let lines = 0;
    for (let r = 0; r < N; r++) {
      let full = true; for (let c = 0; c < N; c++) if (b[r * N + c] < 0) { full = false; break; }
      if (full) { lines++; for (let c = 0; c < N; c++) set.add(r * N + c); }
    }
    for (let c = 0; c < N; c++) {
      let full = true; for (let r = 0; r < N; r++) if (b[r * N + c] < 0) { full = false; break; }
      if (full) { lines++; for (let r = 0; r < N; r++) set.add(r * N + c); }
    }
    return { idx: [...set], lines };
  }

  function renderBoard() {
    for (let i = 0; i < N * N; i++) {
      const v = board[i];
      cells[i].className = 'cell' + (v >= 0 ? ' blk k' + v : '');
    }
  }
  function showGhost(p, r, c) {
    const tmp = board.slice();
    for (const [dr, dc] of p.cells) {
      const i = (r + dr) * N + c + dc;
      tmp[i] = p.k;
      cells[i].classList.add('ghost', 'k' + p.k);
    }
    for (const i of fullLines(tmp).idx) {
      const d = cells[i];
      d.classList.remove('ghost');
      d.classList.add('blk', 'hl');
      if (board[i] < 0) d.classList.add('k' + p.k);
    }
  }
  function buildPiece(p, cls) {
    const el = document.createElement('div');
    el.className = 'piece ' + cls;
    el.style.gridTemplateColumns = `repeat(${p.w}, var(--sz))`;
    for (const [r, c] of p.cells) {
      const b = document.createElement('div');
      b.className = 'blk k' + p.k;
      b.style.gridRow = r + 1; b.style.gridColumn = c + 1;
      el.appendChild(b);
    }
    return el;
  }
  function renderTray() {
    tray.forEach((p, i) => {
      const s = slots[i];
      s.innerHTML = '';
      s.classList.remove('lift');
      s.classList.toggle('dim', !!p && !anyFit(p));
      if (p) s.appendChild(buildPiece(p, 'mini'));
    });
  }
  function renderStats() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('eyebrow').innerHTML = t('picture') + ' <b>' + rev.level + '</b>';
    $('pct').textContent = rev.count + '/' + TT;
    $('bar').style.width = (rev.count / TT * 100) + '%';
    $('combo').textContent = combo > 1 ? 'Combo ×' + combo : '';
  }
  function refill() {
    for (let i = 0; i < 40; i++) {
      tray = [makePiece(), makePiece(), makePiece()];
      if (tray.some(p => anyFit(p))) return;
    }
  }

  let toastTimer;
  function toast(main, sub) {
    const el = $('toast');
    el.textContent = main;
    if (sub) { const s = document.createElement('small'); s.textContent = sub; el.appendChild(s); }
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1150);
  }
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  /* ---------- placing ---------- */
  function place(i, r, c) {
    const p = tray[i];
    for (const [dr, dc] of p.cells) board[(r + dr) * N + c + dc] = p.k;
    score += p.cells.length;
    tray[i] = null;
    const { idx, lines } = fullLines(board);
    const kinds = idx.map(j => board[j]);
    idx.forEach(j => board[j] = -1);
    if (lines) {
      combo++;
      score += Math.round(lines * 10 * (1 + (lines - 1) * 0.5) * Math.min(combo, 8));
      const got = revealAdd(lines * 2 + (lines > 1 ? lines - 1 : 0) + (combo > 1 ? 1 : 0));
      const label = lines > 1 ? t('lines')(lines) : (combo > 1 ? 'Combo ×' + combo : t('line'));
      toast(label, got ? t('pieces')(got) : '');
      buzz(lines > 1 ? [20, 40, 30] : 20);
    } else {
      combo = 0;
    }
    if (tray.every(x => !x)) refill();
    renderBoard();
    idx.forEach((j, n) => {
      const d = cells[j];
      d.className = 'cell blk k' + kinds[n] + ' pop';
      d.style.animationDelay = Math.min(n * 14, 200) + 'ms';
    });
    if (idx.length) setTimeout(() => { idx.forEach(j => cells[j].style.animationDelay = ''); renderBoard(); }, 640);
    if (score > best) { best = score; store.set('svb_best', String(best)); }
    const sc = $('score'); sc.classList.remove('bump'); void sc.offsetWidth; if (lines) sc.classList.add('bump');
    renderStats();
    renderTray();
    saveGame();
    setTimeout(checkOver, idx.length ? 700 : 120);
  }
  let pendingOver = false;
  function checkOver() {
    if (tray.some(p => p && anyFit(p))) return;
    if (!$('done').hidden || rev.count >= TT) { pendingOver = true; return; }
    $('finalScore').textContent = score;
    $('overTxt').innerHTML = t('overTxt')(best, rev.count + '/' + TT);
    $('over').hidden = false;
    requestAnimationFrame(() => drawReveal($('oc')));
  }
  $('again').addEventListener('click', () => {
    board.fill(-1); score = 0; combo = 0; refill();
    $('over').hidden = true;
    renderBoard(); renderTray(); renderStats(); saveGame();
  });

  /* ---------- drag ---------- */
  let drag = null;
  function geom() {
    const a = cells[0].getBoundingClientRect(), b = cells[1].getBoundingClientRect();
    return { x: a.left, y: a.top, cell: a.width, pitch: b.left - a.left };
  }
  slots.forEach((s, i) => s.addEventListener('pointerdown', e => {
    if (!tray[i] || drag) return;
    e.preventDefault();
    const el = buildPiece(tray[i], 'float');
    document.body.appendChild(el);
    drag = { i, p: tray[i], el, touch: e.pointerType !== 'mouse', r: null, c: null, ok: false };
    s.classList.add('lift');
    moveDrag(e);
  }));
  function moveDrag(e) {
    const g = geom(), gp = g.pitch - g.cell, p = drag.p;
    const W = p.w * g.pitch - gp, H = p.h * g.pitch - gp;
    const x = e.clientX - W / 2;
    const y = drag.touch ? e.clientY - H - Math.max(40, g.cell * 1.1) : e.clientY - H / 2;
    drag.el.style.setProperty('--sz', g.cell + 'px');
    drag.el.style.gap = gp + 'px';
    drag.el.style.transform = `translate(${x}px, ${y}px)`;
    const c = Math.round((x - g.x) / g.pitch), r = Math.round((y - g.y) / g.pitch);
    if (r !== drag.r || c !== drag.c) {
      drag.r = r; drag.c = c;
      drag.ok = canPlace(p, r, c);
      renderBoard();
      if (drag.ok) showGhost(p, r, c);
    }
  }
  function endDrag(commit) {
    if (!drag) return;
    const d = drag; drag = null;
    d.el.remove();
    slots[d.i].classList.remove('lift');
    renderBoard();
    if (commit && d.ok) place(d.i, d.r, d.c);
  }
  window.addEventListener('pointermove', e => { if (drag) { e.preventDefault(); moveDrag(e); } }, { passive: false });
  window.addEventListener('pointerup', () => endDrag(true));
  window.addEventListener('pointercancel', () => endDrag(false));

  /* ---------- picture ---------- */
  const images = {};
  function levelImage() {
    const src = LEVELS[(rev.level - 1) % LEVELS.length];
    if (!images[src]) {
      const img = new Image();
      img.onload = () => { img.ready = true; kick(); };
      img.src = src;
      images[src] = img;
    }
    return images[src];
  }
  const fades = new Map();
  function revealAdd(n) {
    const before = rev.count;
    rev.count = Math.min(TT, rev.count + n);
    const now = performance.now();
    rev.order.slice(before, rev.count).forEach((tile, k) => fades.set(tile, now + k * 110));
    saveRev();
    kick();
    if (rev.count >= TT && before < TT) setTimeout(showDone, (rev.count - before) * 110 + 900);
    return rev.count - before;
  }
  function drawReveal(cv, all) {
    const css = cv.getBoundingClientRect().width;
    if (!css) return false;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const S = Math.round(css * dpr);
    if (cv.width !== S) { cv.width = S; cv.height = S; }
    const ctx = cv.getContext('2d');
    const img = levelImage();
    ctx.fillStyle = '#0c1336'; ctx.fillRect(0, 0, S, S);
    if (img.ready) {
      const sw = img.naturalWidth, sh = img.naturalHeight, m = Math.min(sw, sh);
      ctx.drawImage(img, (sw - m) / 2, (sh - m) / 2, m, m, 0, 0, S, S);
    }
    if (all) return false;
    const ts = S / T, now = performance.now();
    const shown = new Set(rev.order.slice(0, rev.count));
    let active = false;
    for (let tile = 0; tile < TT; tile++) {
      let a = 1;
      if (shown.has(tile)) {
        const st = fades.get(tile);
        if (st === undefined) continue;
        active = true;
        a = now < st ? 1 : 1 - (now - st) / 520;
        if (a <= 0) { fades.delete(tile); continue; }
      }
      drawCover(ctx, (tile % T) * ts, Math.floor(tile / T) * ts, ts, a, dpr);
    }
    return active;
  }
  function drawCover(ctx, x, y, s, a, dpr) {
    ctx.save();
    ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(x, y, x + s, y + s);
    g.addColorStop(0, '#121a48'); g.addColorStop(1, '#090e2c');
    ctx.fillStyle = g; ctx.fillRect(x, y, s, s);
    ctx.strokeStyle = 'rgba(164,92,255,.45)'; ctx.lineWidth = dpr;
    ctx.strokeRect(x + dpr, y + dpr, s - 2 * dpr, s - 2 * dpr);
    ctx.fillStyle = 'rgba(34,228,255,.35)';
    const cx = x + s / 2, cy = y + s / 2, r = s * 0.12;
    ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath(); ctx.fill();
    if (a < 1) { ctx.globalAlpha = Math.max(0, a * (1 - a) * 2.4); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, s, s); }
    ctx.restore();
  }
  let rafOn = false;
  function tick() {
    let act = drawReveal($('rc'));
    if (!$('peek').hidden) act = drawReveal($('pc')) || act;
    if (!$('done').hidden) drawReveal($('dc'), true);
    if (act) requestAnimationFrame(tick); else rafOn = false;
  }
  function kick() { if (!rafOn) { rafOn = true; requestAnimationFrame(tick); } }
  window.addEventListener('resize', kick);

  $('reveal').addEventListener('click', () => {
    $('peekTxt').textContent = t('peekTxt')(rev.count);
    $('peek').hidden = false; kick();
  });
  $('closePeek').addEventListener('click', () => { $('peek').hidden = true; });
  $('helpBtn').addEventListener('click', () => { $('help').hidden = false; });
  $('closeHelp').addEventListener('click', () => { $('help').hidden = true; });
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'el' ? 'en' : 'el';
    store.set('svb_lang', lang);
    applyLang(); renderStats();
  });

  function showDone() {
    if (!$('over').hidden) { $('over').hidden = true; pendingOver = true; }
    $('done').hidden = false;
    requestAnimationFrame(() => drawReveal($('dc'), true));
  }
  $('next').addEventListener('click', () => {
    rev = newReveal(rev.level + 1); saveRev(); fades.clear();
    $('done').hidden = true;
    renderStats(); kick();
    if (pendingOver) { pendingOver = false; checkOver(); }
  });

  /* ---------- start ---------- */
  applyLang();
  if (!loadGame()) refill();
  renderBoard(); renderTray(); renderStats();
  kick();
  if (rev.count >= TT) showDone();
  else setTimeout(checkOver, 300);
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
